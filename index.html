<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qo'l sehri</title>
<style>
  :root { --bg:#05060d; --fg:#d9ffc2; --lime:#b6ff3c; --muted:#7f8aa3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cam { position:fixed; right:12px; bottom:12px; width:132px; border-radius:10px;
    transform:scaleX(-1); opacity:.55; border:1px solid #ffffff22; display:none; }
  #panel { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px;
    background:rgba(5,6,13,.82); backdrop-filter:blur(6px); }
  button.alt { background:transparent; color:var(--fg); border:1px solid #ffffff44; }
  #panel h1 { margin:0; font-size:clamp(28px,6vw,48px); font-weight:650; letter-spacing:-.02em; }
  #panel p { margin:0; max-width:34ch; color:var(--muted); line-height:1.5; }
  button { font:inherit; font-weight:600; padding:14px 28px; border:0; border-radius:999px;
    background:var(--lime); color:#0a1400; cursor:pointer; }
  button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  #hud { position:fixed; left:14px; top:12px; font-size:14px; color:var(--muted); display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div id="hud">Qo'l topilmadi</div>
<div id="panel">
  <h1>Qo'l sehri</h1>
  <p>Kamera oldida qo'lingizni oching va musht qiling. Zarrachalar qo'lingizga ergashadi.</p>
  <button id="start">Kamerani yoqish</button>
  <button id="touch" class="alt">Kamerasiz sinash (barmoq bilan)</button>
  <p id="msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cam = document.getElementById('cam'), hud = document.getElementById('hud');
const panel = document.getElementById('panel'), msg = document.getElementById('msg');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();
const N = innerWidth < 600 ? 1400 : 2600;
const P = Array.from({length:N}, (_, i) => ({
  x: Math.random()*W, y: Math.random()*H, vx:0, vy:0,
  a: Math.random()*Math.PI*2,
  ring: 0.72 + 0.28*Math.floor(Math.random()*4)/3 + Math.random()*0.05,
  spread: Math.random(),
  hue: 70 + Math.random()*55
}));
const hand = { seen:false, x:W/2, y:H/2, open:0.5, tx:W/2, ty:H/2, topen:0.5, last:0 };
const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
function onResults(r){
  const lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
  if (!lm){ hand.seen = false; return; }
  const pc = [0,5,9,13,17].reduce((s,i)=>({x:s.x+lm[i].x/5, y:s.y+lm[i].y/5}), {x:0,y:0});
  const palm = d(lm[0], lm[9]) || 0.1;
  const tips = [4,8,12,16,20].reduce((s,i)=>s+d(lm[i], pc), 0)/5;
  const ratio = tips/palm;
  hand.topen = Math.min(1, Math.max(0, (ratio-1.0)/0.8));
  const GAIN = 2.0;
  const nx = Math.min(1, Math.max(0, 0.5 + (pc.x-0.5)*GAIN));
  const ny = Math.min(1, Math.max(0, 0.5 + (pc.y-0.5)*GAIN));
  hand.tx = (1-nx)*W; hand.ty = ny*H;
  hand.seen = true; hand.last = performance.now();
}
let t0 = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-t0)/1000); t0 = now;
  hand.x += (hand.tx-hand.x)*0.45; hand.y += (hand.ty-hand.y)*0.45;
  hand.open += (hand.topen-hand.open)*0.25;
  if (!hand.seen){
    if (ptr.on){ hand.tx = ptr.x; hand.ty = ptr.y; hand.topen = ptr.down ? 0 : 1; }
    else { hand.tx = W/2; hand.ty = H/2; hand.topen = 0.5; }
  }
  hud.style.visibility = (ptr.on && !hand.seen) ? 'hidden' : 'visible';
  const cx = hand.x, cy = hand.y, o = hand.open;
  const base = Math.min(W,H);
  const R = base*(0.16 + 0.04*(1-o));
  const spin = (0.6 + 1.6*(1-o))*now/1000;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,6,13,0.22)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (const p of P){
    const ang = p.a + spin*(p.ring>0.9?-1:1);
    const rr = R*p.ring*(1-o) + (base*(0.12 + 0.5*p.spread) + Math.sin(now/400+p.a*5)*14)*o;
    const tx = cx + Math.cos(ang)*rr, ty = cy + Math.sin(ang)*rr;
    const k = 7 + 7*(1-o);
    p.vx += (tx-p.x)*k*dt; p.vy += (ty-p.y)*k*dt;
    p.vx *= 0.86; p.vy *= 0.86;
    p.x += p.vx; p.y += p.vy;
    const sp = Math.hypot(p.vx,p.vy);
    const len = Math.min(9, 2 + sp*0.7);
    const ux = sp>0.01 ? p.vx/sp : 1, uy = sp>0.01 ? p.vy/sp : 0;
    ctx.strokeStyle = `hsla(${p.hue},100%,${46+Math.min(12,sp*1.5)}%,${0.3+Math.min(0.3,sp*0.04)})`;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+ux*len, p.y+uy*len); ctx.stroke();
  }
  if (hand.seen && now-hand.last>1200) hand.seen = false;
  hud.textContent = hand.seen ? (hand.open>0.55 ? 'Qo\'l ochiq' : 'Musht') : 'Qo\'l topilmadi';
  requestAnimationFrame(frame);
      }
