<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qo'l sehri</title>
<style>
  :root { --bg:#05060d; --fg:#d9ffc2; --lime:#b6ff3c; --muted:#7f8aa3; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #cam { position:fixed; right:12px; bottom:12px; width:132px; border-radius:10px;
    transform:scaleX(-1); opacity:.55; border:1px solid #ffffff22; display:none; }
  #panel { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px;
    background:rgba(5,6,13,.82); }
  button.alt { background:transparent; color:var(--fg); border:1px solid #ffffff44; }
  #panel h1 { margin:0; font-size:clamp(28px,6vw,48px); font-weight:650; }
  #panel p { margin:0; max-width:34ch; color:var(--muted); line-height:1.5; }
  button { font:inherit; font-weight:600; padding:14px 28px; border:0; border-radius:999px;
    background:var(--lime); color:#0a1400; cursor:pointer; }
  #hud { position:fixed; left:14px; top:12px; font-size:14px; color:var(--muted); display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="cam" playsinline muted></video>
<div id="hud">Qo'l topilmadi</div>
<div id="panel">
  <h1>Qo'l sehri</h1>
  <p>Ochiq kaft, musht yoki chimdim qiling. Zarrachalar qo'lingizga ergashadi.</p>
  <button id="start">Kamerani yoqish</button>
  <button id="touch" class="alt">Kamerasiz sinash (barmoq bilan)</button>
  <p id="msg"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cam = document.getElementById('cam'), hud = document.getElementById('hud');
const panel = document.getElementById('panel'), msg = document.getElementById('msg');
let W, H;
function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W; cv.height = H;
}
addEventListener('resize', resize); resize();
const N = innerWidth < 600 ? 1200 : 2200;
const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
const pa = new Float32Array(N), ps = new Float32Array(N), pj = new Float32Array(N);
for (let i = 0; i < N; i++){
  px[i] = Math.random()*W; py[i] = Math.random()*H;
  pa[i] = Math.random()*6.2832; ps[i] = Math.random(); pj[i] = Math.random()-0.5;
}
const COLORS = ['hsla(75,100%,55%,.55)','hsla(90,100%,55%,.55)','hsla(105,100%,55%,.55)','hsla(120,95%,58%,.55)','hsla(135,90%,60%,.55)'];
const NAMES = {open:'Ochiq kaft', fist:'Musht', pinch:'Chimdim'};
let act = N, lastG = '';
const hand = {seen:false, x:W/2, y:H/2, tx:W/2, ty:H/2, last:0, g:'fist'};
const w = {open:0, fist:1, pinch:0};
const d = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);

function onResults(r){
  const lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
  if (!lm){ hand.seen = false; return; }
  const pc = [0,5,9,13,17].reduce((s,i)=>({x:s.x+lm[i].x/5, y:s.y+lm[i].y/5}), {x:0,y:0});
  const palm = d(lm[0], lm[9]) || 0.1;
  const r3 = [12,16,20].reduce((s,i)=>s+d(lm[i],pc), 0)/3/palm;
  const pinch = d(lm[4], lm[8])/palm;
  if ((hand.g === 'pinch' ? pinch < 0.5 : pinch < 0.3) && r3 > 1.3) hand.g = 'pinch';
  else if (r3 > 1.55) hand.g = 'open';
  else if (r3 < 1.2) hand.g = 'fist';
  else if (hand.g === 'pinch') hand.g = r3 > 1.4 ? 'open' : 'fist';
  const GAIN = 2.0;
  const nx = Math.min(1, Math.max(0, 0.5 + (pc.x-0.5)*GAIN));
  const ny = Math.min(1, Math.max(0, 0.5 + (pc.y-0.5)*GAIN));
  hand.tx = (1-nx)*W; hand.ty = ny*H;
  hand.seen = true; hand.last = performance.now();
} 
let t0 = performance.now(), acc = 0, fc = 0;
function frame(now){
  const rdt = (now-t0)/1000, dt = Math.min(0.033, rdt); t0 = now;
  acc += rdt;
  if (++fc === 30){
    const avg = acc/30;
    if (avg > 0.026 && act > 500) act = Math.max(500, Math.floor(act*0.85));
    else if (avg < 0.019 && act < N) act = Math.min(N, Math.floor(act*1.1)+1);
    acc = 0; fc = 0;
  }
  if (hand.seen && now-hand.last > 1200) hand.seen = false;
  let g = hand.g;
  if (!hand.seen){
    if (ptr.on){ hand.tx = ptr.x; hand.ty = ptr.y; g = ptr.down ? 'fist' : 'open'; }
    else { hand.tx = W/2; hand.ty = H/2; g = 'fist'; }
  }
  for (const k in w) w[k] += ((g === k ? 1 : 0) - w[k])*0.18;
  hand.x += (hand.tx-hand.x)*0.5; hand.y += (hand.ty-hand.y)*0.5;
  if (g !== lastG){ hud.textContent = NAMES[g]; lastG = g; }
  hud.style.visibility = (ptr.on && !hand.seen) ? 'hidden' : 'visible';

  const cx = hand.x, cy = hand.y, base = Math.min(W,H), spin = now/1000;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,6,13,0.25)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.6; ctx.lineCap = 'round';

  for (let b = 0; b < 5; b++){
    ctx.beginPath();
    for (let i = b; i < act; i += 5){
      const s = ps[i], fr = Math.sqrt(s), a = pa[i];
      const arm = Math.floor(a/6.2832*3)*2.0944;
      const ga = arm + fr*3.4 + spin*0.6 + pj[i]*0.35, gr = base*0.30*fr;
      const sa = a + spin*(i&1 ? -0.4 : 0.4), sr = base*(0.12+0.5*s) + Math.sin(now/400+a*5)*14;
      const ba = a*3 + spin*1.5, br = base*0.07*(0.6+0.4*Math.sin(a*7+s*9));
      const tx = cx + Math.cos(ga)*gr*w.fist + Math.cos(sa)*sr*w.open + Math.cos(ba)*br*w.pinch;
      const ty = cy + Math.sin(ga)*gr*0.8*w.fist + Math.sin(sa)*sr*w.open + Math.sin(ba)*br*w.pinch;
      vx[i] += (tx-px[i])*10*dt; vy[i] += (ty-py[i])*10*dt;
      vx[i] *= 0.86; vy[i] *= 0.86;
      px[i] += vx[i]; py[i] += vy[i];
      const sp = Math.hypot(vx[i], vy[i]), len = Math.min(9, 2+sp*0.7);
      const ux = sp > 0.01 ? vx[i]/sp : 1, uy = sp > 0.01 ? vy[i]/sp : 0;
      ctx.moveTo(px[i], py[i]); ctx.lineTo(px[i]+ux*len, py[i]+uy*len);
    }
    ctx.strokeStyle = COLORS[b];
    ctx.stroke();
  }
  requestAnimationFrame(frame);
}

async function start(){
  msg.textContent = 'Yuklanmoqda…';
  try {
    if (typeof Hands === 'undefined') throw new Error('MediaPipe yuklanmadi. Internetni tekshiring.');
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false});
    cam.srcObject = stream; await cam.play(); cam.style.display = 'block';
    const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.4, minTrackingConfidence:0.35});
    hands.onResults(onResults);
    panel.style.display = 'none'; hud.style.display = 'block';
    let busy = false;
    const tick = async () => {
      if (!busy && cam.readyState >= 2){ busy = true; try { await hands.send({image:cam}); } catch(e){} busy = false; }
      if (cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(tick); else requestAnimationFrame(tick);
    };
    tick();
  } catch(e){
    msg.textContent = 'Xato: ' + (e.message || e);
  }
}
const ptr = {on:false, down:false, x:innerWidth/2, y:innerHeight/2};
document.getElementById('start').addEventListener('click', start);
document.getElementById('touch').addEventListener('click', () => {
  ptr.on = true; panel.style.display = 'none';
});
cv.style.touchAction = 'none';
addEventListener('load', () => start());
cv.addEventListener('pointerdown', e => { ptr.down = true; ptr.x = e.clientX; ptr.y = e.clientY; });
cv.addEventListener('pointermove', e => { ptr.x = e.clientX; ptr.y = e.clientY; });
addEventListener('pointerup', () => { ptr.down = false; });
addEventListener('pointercancel', () => { ptr.down = false; });
requestAnimationFrame(frame);
act = innerWidth < 600 ? 700 : 1400;
function lowRes(){ cv.width = W/2; cv.height = H/2; ctx.setTransform(0.5,0,0,0.5,0,0); }
lowRes(); addEventListener('resize', lowRes);
if (cam.requestVideoFrameCallback){
  const rvfc = cam.requestVideoFrameCallback.bind(cam); let lastRun = 0;
  cam.requestVideoFrameCallback = cb => rvfc(t => {
    const n = performance.now();
    if (n-lastRun < 70) cam.requestVideoFrameCallback(cb); else { lastRun = n; cb(t); }
  });
}
act = innerWidth < 600 ? 700 : 1400;
function lowRes(){ cv.width = W/2; cv.height = H/2; ctx.setTransform(0.5,0,0,0.5,0,0); }
lowRes(); addEventListener('resize', lowRes);
if (cam.requestVideoFrameCallback){
  const rvfc = cam.requestVideoFrameCallback.bind(cam); let lastRun = 0;
  cam.requestVideoFrameCallback = cb => rvfc(t => {
    const n = performance.now();
    if (n-lastRun < 70) cam.requestVideoFrameCallback(cb); else { lastRun = n; cb(t); }
  });
}
const gum = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
navigator.mediaDevices.getUserMedia = () => gum({video:{facingMode:'user', width:{ideal:320}, height:{ideal:240}}, audio:false});
NAMES.peace = 'Tinchlik: yurak'; NAMES.point = "Ko'rsatkich";
w.peace = 0; w.point = 0;
const C2 = COLORS.map(c => c.replace('.55', '.8'));
let cand = '', candN = 0;
onResults = function(r){
  const lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
  if (!lm){ hand.seen = false; return; }
  const palm = d(lm[0], lm[9]) || 0.1;
  const ext = (t, p) => d(lm[t], lm[0]) > d(lm[p], lm[0])*1.1;
  const ix = ext(8,6), md = ext(12,10), rg = ext(16,14), pk = ext(20,18);
  const n = ix + md + rg + pk, pinch = d(lm[4], lm[8])/palm;
  let raw = null;
  if ((hand.g === 'pinch' ? pinch < 0.5 : pinch < 0.3) && md && rg && pk) raw = 'pinch';
  else if (ix && md && !rg && !pk) raw = 'peace';
  else if (ix && !md && !rg && !pk) raw = 'point';
  else if (n >= 3) raw = 'open';
  else if (n === 0) raw = 'fist';
  if (raw && raw !== hand.g){
    if (raw === cand){ if (++candN >= 3){ hand.g = raw; cand = ''; candN = 0; } }
    else { cand = raw; candN = 1; }
  } else { cand = ''; candN = 0; }
  const pc = hand.g === 'point' ? lm[8] : [0,5,9,13,17].reduce((s,i)=>({x:s.x+lm[i].x/5, y:s.y+lm[i].y/5}), {x:0,y:0});
  const GAIN = 2.0;
  const nx = Math.min(1, Math.max(0, 0.5 + (pc.x-0.5)*GAIN));
  const ny = Math.min(1, Math.max(0, 0.5 + (pc.y-0.5)*GAIN));
  hand.tx = (1-nx)*W; hand.ty = ny*H;
  hand.seen = true; hand.last = performance.now();
};
frame = function(now){
  const rdt = (now-t0)/1000, dt = Math.min(0.033, rdt); t0 = now;
  acc += rdt;
  if (++fc === 30){
    const avg = acc/30;
    if (avg > 0.026 && act > 400) act = Math.max(400, Math.floor(act*0.85));
    else if (avg < 0.019 && act < N) act = Math.min(N, Math.floor(act*1.1)+1);
    acc = 0; fc = 0;
  }
  if (hand.seen && now-hand.last > 1200) hand.seen = false;
  let g = hand.g;
  if (!hand.seen){
    if (ptr.on){ hand.tx = ptr.x; hand.ty = ptr.y; g = ptr.down ? 'fist' : 'open'; }
    else { hand.tx = W/2; hand.ty = H/2; g = 'fist'; }
  }
  for (const k in w) w[k] += ((g === k ? 1 : 0) - w[k])*0.2;
  hand.x += (hand.tx-hand.x)*0.5; hand.y += (hand.ty-hand.y)*0.5;
  if (g !== lastG){ hud.textContent = NAMES[g]; lastG = g; }
  hud.style.visibility = (ptr.on && !hand.seen) ? 'hidden' : 'visible';
  const cx = hand.x, cy = hand.y, base = Math.min(W,H), spin = now/1000;
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,6,13,0.28)';
  ctx.fillRect(0, 0, W, H);
  ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  for (let b = 0; b < 5; b++){
    ctx.beginPath();
    for (let i = b; i < act; i += 5){
      const s = ps[i], a = pa[i], fr = Math.sqrt(s);
      let ox = 0, oy = 0, f;
      if ((f = w.fist) > 0.01){
        const arm = Math.floor(a/6.2832*3)*2.0944, ga = arm + fr*3.4 + spin*0.6 + pj[i]*0.35, gr = base*0.30*fr;
        ox += Math.cos(ga)*gr*f; oy += Math.sin(ga)*gr*0.8*f;
      }
      if ((f = w.open) > 0.01){
        const sa = a + spin*(i&1 ? -0.4 : 0.4), sr = base*(0.12+0.5*s) + Math.sin(now/400+a*5)*14;
        ox += Math.cos(sa)*sr*f; oy += Math.sin(sa)*sr*f;
      }
      if ((f = w.pinch) > 0.01){
        const ba = a*3 + spin*1.5, br = base*0.07*(0.6+0.4*Math.sin(a*7+s*9));
        ox += Math.cos(ba)*br*f; oy += Math.sin(ba)*br*f;
      }
      if ((f = w.peace) > 0.01){
        const sn = Math.sin(a), hx = 16*sn*sn*sn;
        const hy = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a));
        const hs = base*0.011*(1+0.06*Math.sin(now/180))*(0.35+0.65*s);
        ox += hx*hs*f; oy += hy*hs*f;
      }
      if ((f = w.point) > 0.01){
        const qa = a*5 + spin*5, qr = base*0.035*(0.3+fr);
        ox += Math.cos(qa)*qr*f; oy += Math.sin(qa)*qr*f;
      }
      vx[i] += (cx+ox-px[i])*10*dt; vy[i] += (cy+oy-py[i])*10*dt;
      vx[i] *= 0.86; vy[i] *= 0.86;
      px[i] += vx[i]; py[i] += vy[i];
      const sp = Math.hypot(vx[i], vy[i]), len = Math.min(9, 2+sp*0.7);
      const ux = sp > 0.01 ? vx[i]/sp : 1, uy = sp > 0.01 ? vy[i]/sp : 0;
      ctx.moveTo(px[i], py[i]); ctx.lineTo(px[i]+ux*len, py[i]+uy*len);
    }
    ctx.strokeStyle = C2[b];
    ctx.stroke();
  }
  requestAnimationFrame(frame);
};
</script>
</body>
</html>
