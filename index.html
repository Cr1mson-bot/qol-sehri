<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qo'l sehri</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#05060d; color:#d9ffc2; overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #cam { position:fixed; right:10px; bottom:10px; width:96px; border-radius:8px; z-index:2;
    transform:scaleX(-1); opacity:.6; display:none; }
  #hud { position:fixed; left:14px; top:12px; font-size:14px; color:#7f8aa3; display:none; z-index:2; }
  #panel { position:fixed; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; text-align:center; padding:24px; background:rgba(5,6,13,.85); }
  #panel h1 { margin:0; font-size:clamp(28px,6vw,48px); }
  #panel p { margin:0; max-width:34ch; color:#7f8aa3; line-height:1.5; }
  button { font:inherit; font-weight:600; padding:14px 28px; border:0; border-radius:999px;
    background:#6fb4ff; color:#04122e; cursor:pointer; }
  button.alt { background:transparent; color:#d9ffc2; border:1px solid #ffffff44; }
</style>
</head>
<body>
<video id="cam" playsinline muted></video>
<div id="hud">Qo'l topilmadi</div>
<div id="panel">
  <h1>Qo'l sehri</h1>
  <p>Qo'lingizni kameraga ko'rsating: ochiq kaft, musht, chimdim, tinchlik belgisi yoki ko'rsatkich barmoq.</p>
  <button id="start">Kamerani yoqish</button>
  <button id="touch" class="alt">Kamerasiz sinash (barmoq bilan)</button>
  <p id="msg"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script>
function workerMain(){
  let cv, ctx, W = 1, H = 1, DP = 1, N = 36;
  const L = 16;
  let px, py, pang, ps, pa, pz, pk, pm, trx, try2, head = 0;
  const w = {open:0, fist:1, pinch:0, peace:0, point:0};
  const hd = {x:0, y:0, tx:0, ty:0, vx:0, vy:0, g:'fist', last:0};
  const ptr = {on:false, down:false, x:0, y:0};
  let t0 = 0, SPR = [];
  function mk(p){
    const c = typeof OffscreenCanvas !== 'undefined' ? new OffscreenCanvas(96, 96) : document.createElement('canvas');
    c.width = c.height = 96;
    const g = c.getContext('2d'); g.translate(48, 48);
    g.shadowColor = p.b; g.shadowBlur = 14;
    const gr = g.createLinearGradient(-22, 0, 30, 0);
    gr.addColorStop(0, p.c); gr.addColorStop(0.55, p.b); gr.addColorStop(1, p.a);
    g.beginPath(); g.moveTo(30, 0); g.lineTo(-22, -17); g.lineTo(-10, 0); g.lineTo(-22, 17); g.closePath();
    g.fillStyle = gr; g.fill();
    g.shadowBlur = 0; g.lineWidth = 1.6; g.strokeStyle = p.a; g.stroke();
    const sp = g.createRadialGradient(30, 0, 0, 30, 0, 16);
    sp.addColorStop(0, 'rgba(255,255,255,.95)'); sp.addColorStop(0.35, 'rgba(160,220,255,.5)'); sp.addColorStop(1, 'rgba(80,140,255,0)');
    g.fillStyle = sp; g.fillRect(14, -16, 32, 32);
    return c;
  }
  function init(m){
    cv = m.canvas; W = m.W; H = m.H; DP = m.DP; N = m.N;
    cv.width = Math.round(W*DP); cv.height = Math.round(H*DP);
    ctx = cv.getContext('2d');
    px = new Float32Array(N); py = new Float32Array(N); pang = new Float32Array(N);
    ps = new Float32Array(N); pa = new Float32Array(N); pz = new Float32Array(N);
    pk = new Float32Array(N); pm = new Float32Array(N);
    trx = new Float32Array(N*L); try2 = new Float32Array(N*L);
    for (let i = 0; i < N; i++){
      px[i] = Math.random()*W; py[i] = Math.random()*H;
      ps[i] = (i*0.6180339)%1; pa[i] = i*2.39996; pz[i] = (i*0.381966)%1;
      pk[i] = i%3; pm[i] = Math.floor(i/3)/Math.ceil(N/3);
      for (let j = 0; j < L; j++){ trx[i*L+j] = px[i]; try2[i*L+j] = py[i]; }
    }
    SPR = [
      mk({a:'#8fd8ff', b:'#1f5cff', c:'#0a1a6e'}),
      mk({a:'#b5ecff', b:'#2f86ff', c:'#0b2a8a'}),
      mk({a:'#7aaeff', b:'#1738d6', c:'#07124f'})
    ];
    hd.x = hd.tx = W/2; hd.y = hd.ty = H/2;
    t0 = performance.now();
    tick();
  }
  self.onmessage = e => {
    const m = e.data, now = performance.now();
    if (m.t === 'init') init(m);
    else if (m.t === 'hand'){
      if (m.seen){
        const dt = (now-hd.last)/1000;
        if (dt > 0.004 && dt < 0.3 && now-hd.last < 450){
          hd.vx += ((m.tx-hd.tx)/dt - hd.vx)*0.5; hd.vy += ((m.ty-hd.ty)/dt - hd.vy)*0.5;
        } else { hd.vx = 0; hd.vy = 0; }
        hd.tx = m.tx; hd.ty = m.ty; hd.g = m.g; hd.last = now;
      }
    }
    else if (m.t === 'ptr') Object.assign(ptr, m.p);
    else if (m.t === 'size' && cv){ W = m.W; H = m.H; cv.width = Math.round(W*DP); cv.height = Math.round(H*DP); }
  };
  function tick(){
    frame();
    if (self.requestAnimationFrame) self.requestAnimationFrame(tick); else setTimeout(tick, 16);
  }
  function frame(){
    const now = performance.now();
    const dt = Math.min(0.05, (now-t0)/1000) || 0.016; t0 = now;
    let g = hd.g, ex, ey;
    if (now-hd.last < 450){
      const el = Math.min((now-hd.last)/1000, 0.06);
      ex = hd.tx + hd.vx*el; ey = hd.ty + hd.vy*el;
    } else if (ptr.on){ ex = ptr.x; ey = ptr.y; g = ptr.down ? 'fist' : 'open'; }
    else { ex = W/2; ey = H/2; g = 'fist'; }
    const kw = 1-Math.exp(-dt*12), kh = 1-Math.exp(-dt*36), kp = 1-Math.exp(-dt*26);
    for (const k in w) w[k] += ((g === k ? 1 : 0) - w[k])*kw;
    hd.x += (ex-hd.x)*kh; hd.y += (ey-hd.y)*kh;
    const cx = hd.x, cy = hd.y, base = Math.min(W,H), spin = now/1000;
    head = (head+1)%L;
    for (let i = 0; i < N; i++){
      const s = ps[i], a = pa[i];
      let ox = 0, oy = 0, f;
      if ((f = w.fist) > 0.01){
        const fr = 0.15 + 0.85*pm[i], ga = pk[i]*2.0944 + fr*3.4 + spin*0.6, gr = base*0.30*fr;
        ox += Math.cos(ga)*gr*f; oy += Math.sin(ga)*gr*0.8*f;
      }
      if ((f = w.open) > 0.01){
        const sa = a + spin*(i&1 ? -0.5 : 0.5), sr = base*(0.14 + 0.36*s);
        ox += Math.cos(sa)*sr*f; oy += Math.sin(sa)*sr*f;
      }
      if ((f = w.pinch) > 0.01){
        const ba = a*2 + spin*2, br = base*(0.05 + 0.03*s);
        ox += Math.cos(ba)*br*f; oy += Math.sin(ba)*br*f;
      }
      if ((f = w.peace) > 0.01){
        const t = (i/N)*6.2832, sn = Math.sin(t), sc = (i&1 ? 1 : 0.6)*base*0.011*(1+0.05*Math.sin(now/180));
        ox += 16*sn*sn*sn*sc*f;
        oy += -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t))*sc*f;
      }
      if ((f = w.point) > 0.01){
        const qa = a*3 + spin*5, qr = base*0.035*(0.4 + s);
        ox += Math.cos(qa)*qr*f; oy += Math.sin(qa)*qr*f;
      }
      const nx = px[i] + (cx+ox-px[i])*kp, ny = py[i] + (cy+oy-py[i])*kp;
      const vxp = (nx-px[i])/dt, vyp = (ny-py[i])/dt;
      if (vxp*vxp + vyp*vyp > 1600){
        let d = Math.atan2(vyp, vxp) - pang[i]; d = Math.atan2(Math.sin(d), Math.cos(d));
        pang[i] += d*0.35;
      }
      px[i] = nx; py[i] = ny;
      trx[i*L+head] = nx; try2[i*L+head] = ny;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(DP, 0, 0, DP, 0, 0);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const AL = [0.6, 0.3, 0.12], LW = [3.2, 2.6, 2];
    for (let b = 0; b < 3; b++){
      ctx.beginPath();
      for (let i = 0; i < N; i++){
        for (let j = b*5; j < b*5+5; j++){
          const i0 = i*L + (head-j+L*2)%L, i1 = i*L + (head-j-1+L*2)%L;
          ctx.moveTo(trx[i0], try2[i0]); ctx.lineTo(trx[i1], try2[i1]);
        }
      }
      ctx.lineWidth = LW[b]; ctx.strokeStyle = 'rgba(80,150,255,' + AL[b] + ')'; ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < N; i++){
      const k = (22 + 14*pz[i])/52, c = Math.cos(pang[i])*k*DP, s2 = Math.sin(pang[i])*k*DP;
      ctx.setTransform(c, s2, -s2, c, px[i]*DP, py[i]*DP);
      ctx.drawImage(SPR[i%3], -48, -48);
    }
    ctx.setTransform(DP, 0, 0, DP, 0, 0);
  }
}
const cam = document.getElementById('cam'), hud = document.getElementById('hud');
const panel = document.getElementById('panel'), msg = document.getElementById('msg');
const DPR = Math.min(devicePixelRatio || 1, 2);
let cvs = document.createElement('canvas');
document.body.prepend(cvs);
let send = () => {};
function startRender(){
  const code = '(' + workerMain.toString() + ')()';
  const init = {t:'init', W:innerWidth, H:innerHeight, DP:DPR, N:innerWidth < 600 ? 36 : 60};
  try {
    if (window.Worker && typeof OffscreenCanvas !== 'undefined' && cvs.transferControlToOffscreen){
      const off = cvs.transferControlToOffscreen();
      const wk = new Worker(URL.createObjectURL(new Blob([code], {type:'text/javascript'})));
      init.canvas = off; wk.postMessage(init, [off]);
      send = m => wk.postMessage(m);
      return;
    }
  } catch(e){ cvs.remove(); cvs = document.createElement('canvas'); document.body.prepend(cvs); }
  const fake = {onmessage:null, requestAnimationFrame:f => requestAnimationFrame(f)};
  new Function('self', code)(fake);
  init.canvas = cvs; fake.onmessage({data:init});
  send = m => fake.onmessage({data:m});
}
startRender();
addEventListener('resize', () => send({t:'size', W:innerWidth, H:innerHeight}));
cvs.addEventListener('pointerdown', e => send({t:'ptr', p:{down:true, x:e.clientX, y:e.clientY}}));
cvs.addEventListener('pointermove', e => send({t:'ptr', p:{x:e.clientX, y:e.clientY}}));
addEventListener('pointerup', () => send({t:'ptr', p:{down:false}}));
addEventListener('pointercancel', () => send({t:'ptr', p:{down:false}}));

const NAMES = {open:'Ochiq kaft', fist:'Musht', pinch:'Chimdim', peace:'Tinchlik: yurak', point:"Ko'rsatkich"};
let cur = 'fist', cand = '', candN = 0, shown = '';
function setHud(t){ if (t !== shown){ hud.textContent = t; shown = t; } }
function onResults(r){
  const lm = r.multiHandLandmarks && r.multiHandLandmarks[0];
  if (!lm){ send({t:'hand', seen:false}); setHud("Qo'l topilmadi"); return; }
  const ar = (cam.videoWidth/cam.videoHeight) || 1.33;
  const d = (a, b) => Math.hypot((a.x-b.x)*ar, a.y-b.y);
  const palm = d(lm[0], lm[9]) || 0.1;
  const ext = (t, p) => d(lm[t], lm[0]) > d(lm[p], lm[0])*1.1;
  const ix = ext(8,6), md = ext(12,10), rg = ext(16,14), pk = ext(20,18);
  const n = ix + md + rg + pk, pinch = d(lm[4], lm[8])/palm;
  let raw = null;
  if ((cur === 'pinch' ? pinch < 0.5 : pinch < 0.3) && md && rg && pk) raw = 'pinch';
  else if (ix && md && !rg && !pk) raw = 'peace';
  else if (ix && !md && !rg && !pk) raw = 'point';
  else if (n >= 3) raw = 'open';
  else if (n === 0) raw = 'fist';
  if (raw && raw !== cur){
    if (raw === cand){ if (++candN >= 2){ cur = raw; cand = ''; candN = 0; } }
    else { cand = raw; candN = 1; }
  } else { cand = ''; candN = 0; }
  const pc = cur === 'point' ? lm[8] : [0,5,9,13,17].reduce((s,i) => ({x:s.x+lm[i].x/5, y:s.y+lm[i].y/5}), {x:0, y:0});
  const GAIN = 2.0;
  const nx = Math.min(1, Math.max(0, 0.5 + (pc.x-0.5)*GAIN));
  const ny = Math.min(1, Math.max(0, 0.5 + (pc.y-0.5)*GAIN));
  send({t:'hand', tx:(1-nx)*innerWidth, ty:ny*innerHeight, g:cur, seen:true});
  setHud(NAMES[cur]);
}
let started = false;
async function start(){
  if (started) return;
  started = true; msg.textContent = 'Yuklanmoqda…';
  try {
    if (typeof Hands === 'undefined') throw new Error('MediaPipe yuklanmadi. Internetni tekshiring.');
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:960}, height:{ideal:540}}, audio:false});
    cam.srcObject = stream; await cam.play(); cam.style.display = 'block';
    const hands = new Hands({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.35, minTrackingConfidence:0.35});
    hands.onResults(onResults);
    panel.style.display = 'none'; hud.style.display = 'block';
    let busy = false;
    const next = () => cam.requestVideoFrameCallback ? cam.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    async function tick(){
      if (!busy && cam.readyState >= 2){ busy = true; try { await hands.send({image:cam}); } catch(e){} busy = false; }
      next();
    }
    tick();
  } catch(e){
    started = false; msg.textContent = 'Xato: ' + (e.message || e);
  }
}
document.getElementById('start').addEventListener('click', start);
document.getElementById('touch').addEventListener('click', () => {
  send({t:'ptr', p:{on:true}}); panel.style.display = 'none';
});
addEventListener('load', start);
</script>
</body>
</html>
